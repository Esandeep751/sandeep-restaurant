<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandeep Restaurant - Table Reservation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Sandeep Restaurant</h1>
                <p>Table Reservation System</p>
            </div>
            <img src="PXL_20251025_092026797.MP.jpg" alt="Sandeep Restaurant Logo" class="header-logo">[cite: 1]
        </header>

        <!-- Customer Registration -->
        <div class="card" id="auth-section">
            <h2>Customer Registration</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="reg-phone" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit">Register Account</button>
            </form>
        </div>

        <!-- Table Reservation Section -->
        <div class="card" id="booking-section">
            <h2>Book a Table</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label>Customer ID (Assigned after registration)</label>
                    <input type="number" id="book-customer-id" required>
                </div>
                <div class="form-group">
                    <label>Select Table</label>
                    <select id="book-table-select" required>
                        <option value="">Loading available tables...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="book-date" required>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="book-time" required>
                </div>
                <div class="form-group">
                    <label>Number of Guests</label>
                    <input type="number" id="book-guests" min="1" max="20" required>
                </div>
                <button type="submit">Confirm Reservation</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-password').value
            };
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.customer_id) {
                alert(`Registration successful! Your Customer ID is: ${data.customer_id}`);
                document.getElementById('book-customer-id').value = data.customer_id;
            } else {
                alert('Error: ' + data.error);
            }
        });

        async function loadTables() {
            const res = await fetch('/api/tables');
            const tables = await res.json();
            const select = document.getElementById('book-table-select');
            select.innerHTML = '<option value="">-- Choose a Table --</option>';
            tables.forEach(t => {
                select.innerHTML += `<option value="${t.table_id}">${t.table_number} (${t.location} - Seats: ${t.seating_capacity})</option>`;
            });
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customer_id: document.getElementById('book-customer-id').value,
                table_id: document.getElementById('book-table-select').value,
                reservation_date: document.getElementById('book-date').value,
                reservation_time: document.getElementById('book-time').value,
                guests: document.getElementById('book-guests').value
            };
            const res = await fetch('/api/reservations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message);
            loadTables();
        });

        loadTables();
    </script>
</body>
</html>
